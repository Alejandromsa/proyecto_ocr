[project]
name = "stracon-ocr"
version = "0.1.0"
description = "OCR, forense documental y extracción a JSON para la validación documental de postulantes (STRACON)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pikepdf>=9.0",
    "puremagic>=1.28",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "openvino>=2024.4",
    "zxing-cpp>=2.2",
    "rapidfuzz>=3.10",
    "imagehash>=4.3",
    "docx2python>=3.0",
    "python-docx>=1.1",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.13"]
firmas = ["pyhanko>=0.25"]
layout = ["docling>=2.0"]
azure = ["azure-ai-documentintelligence>=1.0"]

[project.scripts]
socr = "stracon_ocr.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "jiwer>=3.0", "pypdf>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stracon_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
